<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>A Little Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <img
                id="photo"
                src="Photo.gif"
                data-happy-src="PhotoHappy.gif"
                alt="A special photo"
                class="photo"
            >

            <h1 id="headline">I've got a question for you...</h1>

            <p id="subtitle" class="subtitle">
                Will you go on a date with me?
            </p>

            <div class="buttons">
                <button id="yesButton" class="yes-button">
                    Yes ❤️
                </button>

                <div class="no-button-wrap">
                    <button id="noButton" class="no-button">
                        No 🙈
                    </button>

                    <p id="noPersuasion" class="no-persuasion" aria-live="polite" hidden></p>
                </div>
            </div>

            <div id="celebrationActions" class="celebration-actions" hidden>
                <button id="continueButton" class="continue-button" type="button">
                    Continue 💕
                </button>
            </div>

            <div id="datePicker" class="date-picker" hidden>
                <p class="date-picker__label">Pick a date for our date!</p>

                <div class="calendar">
                    <div class="calendar__header">
                        <button
                            id="prevMonthButton"
                            class="calendar__nav"
                            type="button"
                            aria-label="Previous month"
                        >
                            ‹
                        </button>

                        <span id="calendarMonthLabel" class="calendar__month"></span>

                        <button
                            id="nextMonthButton"
                            class="calendar__nav"
                            type="button"
                            aria-label="Next month"
                        >
                            ›
                        </button>
                    </div>

                    <div class="calendar__weekdays">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>

                    <div id="calendarDays" class="calendar__days"></div>
                </div>

                <p id="selectedDateText" class="selected-date-text"></p>

                <button
                    id="confirmDateButton"
                    class="confirm-date-button"
                    type="button"
                    disabled
                >
                    Confirm date 💌
                </button>
            </div>

            <div id="calendarActions" class="calendar-actions" hidden>
                <p class="calendar-actions__hint">
                    Save our date to your phone calendar (7:00 PM – 9:00 PM).
                </p>

                <button
                    id="addToCalendarButton"
                    class="add-to-calendar-button"
                    type="button"
                >
                    Add to Calendar 📅
                </button>
            </div>

        </div>

    </main>

    <canvas id="fireworksCanvas" class="fireworks" aria-hidden="true"></canvas>

    <div id="animalHelper" class="animal-helper" aria-hidden="true">
        <div class="animal-helper__pet">🐻</div>
        <div class="animal-helper__bubble">No? Not on my watch!</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
