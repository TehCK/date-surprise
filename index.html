<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>A Little Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <img
                id="photo"
                src="Photo.gif"
                data-happy-src="PhotoHappy.gif"
                alt="A special photo"
                class="photo"
            >

            <h1 id="headline">我有一个问题要问你...</h1>

            <p id="subtitle" class="subtitle">
                你愿意和我一起去约会吗？
            </p>

            <div class="buttons">
                <button id="yesButton" class="yes-button">
                    愿意 ❤️
                </button>

                <div class="no-button-wrap">
                    <button id="noButton" class="no-button">
                        不愿意 🙈
                    </button>

                    <p id="noPersuasion" class="no-persuasion" aria-live="polite" hidden></p>
                </div>
            </div>

            <div id="celebrationActions" class="celebration-actions" hidden>
                <button id="continueButton" class="continue-button" type="button">
                    继续 💕
                </button>
            </div>

            <div id="datePicker" class="date-picker" hidden>
                <p class="date-picker__label">选择一个日期吧！</p>

                <div class="calendar">
                    <div class="calendar__header">
                        <button
                            id="prevMonthButton"
                            class="calendar__nav"
                            type="button"
                            aria-label="Previous month"
                        >
                            ‹
                        </button>

                        <span id="calendarMonthLabel" class="calendar__month"></span>

                        <button
                            id="nextMonthButton"
                            class="calendar__nav"
                            type="button"
                            aria-label="Next month"
                        >
                            ›
                        </button>
                    </div>

                    <div class="calendar__weekdays">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>

                    <div id="calendarDays" class="calendar__days"></div>
                </div>

                <p id="selectedDateText" class="selected-date-text"></p>

                <button
                    id="confirmDateButton"
                    class="confirm-date-button"
                    type="button"
                    disabled
                >
                    确认日期 💌
                </button>
            </div>

            <div id="calendarActions" class="calendar-actions" hidden>
                <p id="calendarActionsHint" class="calendar-actions__hint">
                    将我们的约会保存到你的手机日历中（晚上7:00 - 晚上9:00）。
                </p>

                <button
                    id="addToCalendarButton"
                    class="add-to-calendar-button"
                    type="button"
                >
                    添加到日历 📅
                </button>

                <a
                    id="icsOpenLink"
                    class="calendar-link calendar-link--fallback"
                    href="#"
                    hidden
                >
                    如果上方按钮无效，请点这里
                </a>
            </div>

        </div>

    </main>

    <canvas id="fireworksCanvas" class="fireworks" aria-hidden="true"></canvas>

    <div id="animalHelper" class="animal-helper" aria-hidden="true">
        <div class="animal-helper__pet">🐻</div>
        <div class="animal-helper__bubble">不愿意？那可不行！</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
